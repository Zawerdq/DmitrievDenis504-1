# Единственный файл параметров робота «Сусанин ИИ».
# Все узлы читают параметры отсюда — не дублируйте значения в коде и launch-файлах.
#
# ВАЖНО: дробные параметры пишите с точкой (20.0, а не 20), иначе ROS 2
# откажется загружать параметр из-за несовпадения типа.
#
# Значения с пометкой «НЕ ИЗМЕРЕНО» — консервативные заглушки. Их нужно
# заменить результатами измерений на реальном роботе (см. docs/SETUP.md, раздел «Калибровка»).

susanin_control:
  ros__parameters:
    # --- геометрия и калибровка -------------------------------------------
    track_width: 0.15        # м, расстояние между серединами гусениц. НЕ ИЗМЕРЕНО
    max_track_speed: 0.30    # м/с, скорость гусеницы при полном ШИМ (duty = 1.0). НЕ ИЗМЕРЕНО

    # --- ограничения команды /cmd_vel -------------------------------------
    max_linear_speed: 0.20   # м/с
    max_angular_speed: 1.50  # рад/с

    # --- ограничения ШИМ --------------------------------------------------
    max_duty: 0.60           # не более 60 % ШИМ, пока не измерены токи моторов (перегрев TB6612)
    min_duty: 0.25           # ниже мотор стоит под током и греет драйвер. НЕ ИЗМЕРЕНО
    duty_deadband: 0.03

    # --- плавность (1/с): 2.0 = разгон от 0 до 100 % за 0.5 с -------------
    max_accel_rate: 2.0
    max_decel_rate: 4.0

    # --- безопасность -----------------------------------------------------
    cmd_vel_timeout: 0.5     # с без /cmd_vel до остановки
    control_rate: 20.0       # Гц
    require_link: true       # не выдавать команды, пока мост не сообщил о связи с ESP32

susanin_esp32_bridge:
  ros__parameters:
    transport: websocket     # единственный вариант, который поддерживает текущая прошивка

    # --- адрес ESP32 (точка доступа bot5) ---------------------------------
    host: "192.168.4.1"
    port: 80
    path: "/ws"

    # --- обмен ------------------------------------------------------------
    send_rate: 20.0          # Гц, частота отправки команды на ESP32
    command_timeout: 0.5     # с: команда от ROS старше этого заменяется остановом
    ping_interval: 0.5       # с, проверка связи ping/pong (0.0 — отключить)
    pong_timeout: 1.5        # с без ответа ESP32 до переподключения
    connect_timeout: 3.0
    reconnect_delay_min: 0.5
    reconnect_delay_max: 5.0

    # --- подключение моторов (вместо перепайки и правки прошивки) ---------
    pwm_max: 255             # полный ШИМ прошивки
    invert_left: false       # true, если левая гусеница крутится назад при команде «вперёд»
    invert_right: false
    swap_sides: false        # true, если левый и правый мотор перепутаны местами
